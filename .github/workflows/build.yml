name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleRelease --no-daemon -PvCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: VideoPlusBrowser-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk VideoPlusBrowser.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VideoPlusBrowser.apk --title "Video Plus Browser (latest)" --notes "build:${{ github.run_number }}"
