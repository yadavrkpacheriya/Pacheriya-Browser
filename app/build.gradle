plugins { id 'com.android.application' }
def vCode = (project.findProperty('vCode') ?: '1').toInteger()
android {
    namespace 'com.pacheriya.vpbrowser'
    compileSdk 34
    defaultConfig {
        applicationId 'com.pacheriya.vpbrowser'
        minSdk 30
        targetSdk 34
        versionCode vCode
        versionName '1.0.' + vCode
    }
    signingConfigs {
        rel {
            storeFile file('vp.jks')
            storePassword 'vpbrowser'
            keyAlias 'vp'
            keyPassword 'vpbrowser'
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.rel } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { checkReleaseBuilds false; abortOnError false }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.10.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
