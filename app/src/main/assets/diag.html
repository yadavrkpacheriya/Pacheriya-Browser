<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostics</title>
<style>
body{margin:0;background:#0f0f14;color:#eee;font-family:system-ui,sans-serif;padding:16px 14px 60px}
h2{margin:8px 0 4px;font-size:20px}p{color:#9aa;font-size:13.5px;line-height:1.45}
.row{display:flex;gap:8px;margin:12px 0}
.b{flex:1;background:#6a4cff;color:#fff;border:0;border-radius:12px;padding:14px;font-size:15px}
.b.s{background:#2a2a36;color:#c9b3ff}
pre{background:#16161c;border:1px solid #262630;border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-word;color:#cdd;max-height:62vh;overflow:auto}
</style></head><body>
<h2>&#129658; Diagnostics</h2>
<p>This gathers what the browser has recorded — crashes, page errors, slow pages, assistant searches and counts. Tap <b>Copy</b>, then paste it to Claude so issues can be fixed.</p>
<div class="row"><button class="b" id="copy">Copy all</button><button class="b s" id="refresh">Refresh</button><button class="b s" id="clear">Clear</button></div>
<pre id="out">Loading…</pre>
<script>
function load(){var t='';try{t=VPApp.diag()}catch(e){t='Diagnostics not available in this view.'}document.getElementById('out').textContent=t;return t;}
document.getElementById('copy').onclick=function(){var t=document.getElementById('out').textContent;try{VPApp.diagCopy(t)}catch(e){ try{navigator.clipboard.writeText(t)}catch(x){} }};
document.getElementById('refresh').onclick=load;
document.getElementById('clear').onclick=function(){try{VPApp.diagClear()}catch(e){}load();};
load();
</script>
</body></html>
