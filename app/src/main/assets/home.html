 if(EDIT){var ab=document.createElement('button');ab.textContent='+ Category';ab.style.cssText='background:#2a3a2a;color:#9f9;border:0;border-radius:10px;padding:9px 14px;font-size:13px';ab.onclick=function(){var n=prompt('New category name');if(n){CATS.push({n:n,a:false,s:[]});saveCats(CATS);render()}};bar.appendChild(ab);
  var rb=document.createElement('button');rb.textContent='Reset';rb.style.cssText='background:#3a2a2a;color:#f99;border:0;border-radius:10px;padding:9px 14px;font-size:13px';rb.onclick=function(){if(confirm('Reset the whole list to defaults?')){CATS=JSON.parse(JSON.stringify(DEFAULT));saveCats(CATS);render()}};bar.appendChild(rb);}
 cEl.appendChild(bar);
 CATS.forEach(function(c,ci){
  var d=document.createElement('details');if(c.a)d.className='a';if(ci===0&&!EDIT)d.open=true;if(EDIT)d.open=true;
  var sm=document.createElement('summary');sm.textContent=c.n;d.appendChild(sm);
  var g=document.createElement('div');g.className='g';
  if(EDIT){
   var ctrl=document.createElement('div');ctrl.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px';
   ctrl.innerHTML='';
   [['\u2191',function(){if(ci>0){var t=CATS[ci-1];CATS[ci-1]=CATS[ci];CATS[ci]=t;saveCats(CATS);render()}}],
    ['\u2193',function(){if(ci<CATS.length-1){var t=CATS[ci+1];CATS[ci+1]=CATS[ci];CATS[ci]=t;saveCats(CATS);render()}}],
    ['Rename',function(){var n=prompt('Category name',c.n);if(n){c.n=n;saveCats(CATS);render()}}],
    ['+ Site',function(){var t=prompt('Site name');if(!t)return;var u=prompt('Site address (e.g. example.com)');if(!u)return;c.s.push({t:t,u:u.replace(/^https?:\/\//,'')});saveCats(CATS);render()}],
    ['Delete category',function(){if(confirm('Delete "'+c.n+'"?')){CATS.splice(ci,1);saveCats(CATS);render()}}]
   ].forEach(function(b){var x=document.createElement('button');x.textContent=b[0];x.style.cssText='background:#26262f;color:#cdd;border:0;border-radius:8px;padding:6px 10px;font-size:12px';x.onclick=b[1];ctrl.appendChild(x)});
   g.appendChild(ctrl);
  }
  c.s.forEach(function(site,si){
   if(EDIT){
    var row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:4px;margin:3px 0';
    var lab=document.createElement('span');lab.textContent=site.t;lab.style.cssText='flex:1;font-size:13px;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    row.appendChild(lab);
    [['\u2191',function(){if(si>0){var t=c.s[si-1];c.s[si-1]=c.s[si];c.s[si]=t;saveCats(CATS);render()}}],
     ['\u2193',function(){if(si<c.s.length-1){var t=c.s[si+1];c.s[si+1]=c.s[si];c.s[si]=t;saveCats(CATS);render()}}],
     ['\u270E',function(){var t=prompt('Name',site.t);if(t===null)return;var u=prompt('Address',site.u);if(u===null)return;site.t=t;site.u=u.replace(/^https?:\/\//,'');saveCats(CATS);render()}],
     ['\u2715',function(){c.s.splice(si,1);saveCats(CATS);render()}]
    ].forEach(function(b){var x=document.createElement('button');x.textContent=b[0];x.style.cssText='background:#1f1f27;color:#E2B33C;border:0;border-radius:7px;padding:5px 9px;font-size:13px';x.onclick=b[1];row.appendChild(x)});
    g.appendChild(row);
   } else {
    var a=document.createElement('a');a.href=/^https?:/.test(site.u)?site.u:'https://'+site.u;a.textContent=site.t;g.appendChild(a);
   }
  });
  d.appendChild(g);cEl.appendChild(d);
 });
}
render();
</script></body></html>
