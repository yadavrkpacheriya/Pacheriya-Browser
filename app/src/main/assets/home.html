<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New tab</title>
<style>body{margin:0;background:#0f0f14;color:#eee;font-family:system-ui,sans-serif;text-align:center;padding:40px 16px}
h1{font-size:26px;margin:20px 0 4px}p{color:#9aa;margin:0 0 24px;font-size:14px}
form{max-width:520px;margin:0 auto 28px}input{width:100%;box-sizing:border-box;padding:14px 18px;border-radius:26px;border:1px solid #333;background:#1c1c24;color:#fff;font-size:16px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px;margin:0 auto}
a{display:block;padding:18px 6px;border-radius:14px;background:#1c1c24;color:#fff;text-decoration:none;font-size:14px}</style></head>
<body><h1>Video Plus Browser</h1><p>Search or type a web address</p>
<form onsubmit="var q=document.getElementById('q').value.trim();if(!q)return false;location.href=/^[^ ]+\.[^ ]+$/.test(q)||/^https?:/.test(q)?(/^https?:/.test(q)?q:'https://'+q):'https://www.google.com/search?q='+encodeURIComponent(q);return false"><input id="q" placeholder="Search or type address" autocomplete="off"></form>
<div class="g"><a href="https://m.youtube.com">YouTube</a><a href="https://www.dailymotion.com">Dailymotion</a><a href="https://vimeo.com">Vimeo</a><a href="https://www.imdb.com">IMDb</a><a href="https://www.facebook.com">Facebook</a><a href="https://www.instagram.com">Instagram</a></div></body></html>
