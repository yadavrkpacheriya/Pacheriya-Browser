<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=6">
<title>PDF</title>
<style>
html,body{margin:0;background:#2a2a2e;color:#eee;font-family:sans-serif}
#bar{position:sticky;top:0;display:flex;gap:8px;align-items:center;background:#17171b;padding:8px 10px;font-size:14px;z-index:5}
#bar button{background:#2f2f3a;color:#fff;border:0;border-radius:7px;padding:8px 12px;font-size:15px}
#pg{flex:1;color:#bbb;font-size:13px}
#wrap{padding:10px;text-align:center}
canvas{max-width:100%;height:auto;background:#fff;margin:0 auto 10px;display:block;box-shadow:0 1px 6px #0007}
#err{padding:24px;color:#f99;line-height:1.5}
</style></head><body>
<div id="bar">
<button id="zo">−</button><button id="zi">+</button>
<span id="pg">Loading…</span>
<button id="dl">Download</button>
</div>
<div id="wrap"></div>
<div id="err"></div>
<script type="module">
import * as pdfjsLib from './pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs';
var qs=new URLSearchParams(location.search), src=decodeURIComponent(qs.get('file')||'');
var wrap=document.getElementById('wrap'), pgEl=document.getElementById('pg'), scale=1.3, doc=null;
document.getElementById('dl').onclick=function(){ if(window.VPApp&&VPApp.dl) VPApp.dl(src); else location.href=src; };
document.getElementById('zi').onclick=function(){ scale=Math.min(4,scale+0.25); render(); };
document.getElementById('zo').onclick=function(){ scale=Math.max(0.5,scale-0.25); render(); };
function render(){ if(!doc) return; wrap.innerHTML=''; var dpr=Math.min(2,window.devicePixelRatio||1);
 for(var i=1;i<=doc.numPages;i++){ (function(n){ doc.getPage(n).then(function(p){
   var vp=p.getViewport({scale:scale*dpr}), c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
   c.style.width=(vp.width/dpr)+'px'; wrap.appendChild(c); p.render({canvasContext:c.getContext('2d'),viewport:vp});
 }); })(i); } }
pdfjsLib.getDocument({url:src,withCredentials:true}).promise.then(function(d){
 doc=d; pgEl.textContent=d.numPages+' page'+(d.numPages>1?'s':''); render();
}).catch(function(e){ pgEl.textContent=''; document.getElementById('err').textContent='Could not open this PDF: '+(e&&e.message||e)+'. Tap Download to save it.'; document.getElementById('dl').onclick=function(){ if(window.VPApp&&VPApp.dl)VPApp.dl(src); }; });
</script></body></html>
